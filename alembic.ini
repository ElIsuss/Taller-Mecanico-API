[alembic]
# path to migration scripts
script_location = alembic

# database url: la resuelve alembic/env.py desde DATABASE_URL / settings.
# Nunca escribir credenciales reales acá (regla 10 del proyecto).
sqlalchemy.url = postgresql+asyncpg://user:password@localhost:5432/dbname

# version location
version_locations = alembic/versions

# timezone to use when rendering the date
# within the migration files as well as the filename.
# string value: one of "fallback", "utc", "tz".
# default: fallback
# timezone = utc

# max length of characters to apply to the
# "version" field of a migration file.
# default: 32
# max_migration_length = 64

# template used to generate migration files
# default: ${rev}_${slug}
# file_template = %%(rev)s_%%(slug)s

# version code separator
# default: _
# version_code_separator = _

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.
# See: https://alembic.sqlalchemy.org/en/latest/tutorial.html#post-write-hooks

# format using "black" - use the console script
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT

logging.disable = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
